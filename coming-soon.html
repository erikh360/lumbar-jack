<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coming Soon — Lumbar Jack</title>
<style>
  :root {
    --bg:        oklch(0.165 0.006 70);
    --bg-soft:   oklch(0.205 0.007 70);
    --border-soft: oklch(0.26 0.007 70);
    --text:      oklch(0.96 0.004 80);
    --text-mut:  oklch(0.74 0.007 75);
    --text-faint:oklch(0.56 0.007 75);
    --accent:    oklch(0.80 0.125 70);
    --accent-dim:oklch(0.80 0.125 70 / 0.14);

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --maxw: 1080px;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  ::selection { background: var(--accent-dim); }

  a { color: inherit; }

  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 28px;
    width: 100%;
  }

  /* ---------- Back link ---------- */
  .back {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 40px 0 0;
    color: var(--text-mut);
    font-size: 15px;
    text-decoration: none;
    transition: color 0.12s ease;
  }
  .back:hover { color: var(--text); }
  .back svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- Hero ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(72px, 12vw, 132px) 28px clamp(56px, 8vw, 88px);
  }

  .pill {
    display: inline-block;
    margin-bottom: 28px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .app-icon {
    width: 100px;
    height: 100px;
    margin: 0 auto 32px;
    border-radius: 24px;
    display: block;
    box-shadow: 0 20px 50px -24px rgba(0,0,0,0.7);
  }

  h1 {
    font-size: clamp(34px, 6vw, 60px);
    line-height: 1.05;
    letter-spacing: -0.03em;
    font-weight: 700;
    margin: 0 0 20px;
    color: var(--text);
    max-width: none;
  }

  .subhead {
    font-size: clamp(18px, 2.4vw, 22px);
    color: var(--text-mut);
    max-width: 42ch;
    margin: 0 auto 44px;
    text-wrap: pretty;
  }

  /* ---------- Notify form ---------- */
  .notify-form {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .notify-form input[type="email"] {
    padding: 13px 18px;
    background: var(--bg-soft);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    width: 260px;
    outline: none;
    transition: border-color 0.12s ease;
  }
  .notify-form input[type="email"]::placeholder { color: var(--text-faint); }
  .notify-form input[type="email"]:focus { border-color: var(--accent); }

  .notify-form button {
    padding: 13px 22px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: oklch(0.165 0.006 70);
    font-family: var(--font);
    font-size: 16px;
    font-weight: 650;
    cursor: pointer;
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .notify-form button:hover { opacity: 0.88; transform: translateY(-1px); }

  .reassure {
    font-size: 14px;
    color: var(--text-faint);
    letter-spacing: 0.01em;
  }

  /* ---------- Footer ---------- */
  footer {
    border-top: 1px solid var(--border-soft);
    padding: 38px 0 56px;
  }
  .foot-inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 18px 28px;
  }
  .foot-left { color: var(--text-faint); font-size: 14.5px; }
  .foot-links {
    display: flex;
    gap: 24px;
    font-size: 14.5px;
  }
  .foot-links a {
    color: var(--text-mut);
    text-decoration: none;
    transition: color 0.12s ease;
  }
  .foot-links a:hover { color: var(--text); }
  .made {
    width: 100%;
    margin-top: 8px;
    color: var(--text-faint);
    font-size: 13.5px;
  }

  @media (max-width: 520px) {
    body { font-size: 17px; }
    .wrap { padding: 0 22px; }
    .notify-form input[type="email"] { width: 100%; }
    .notify-form { flex-direction: column; align-items: stretch; }
    .foot-inner { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

  <main>
    <div class="wrap">
      <a class="back" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6"/><path d="M11 6l-6 6 6 6"/></svg>
        Back
      </a>
    </div>

    <section class="hero">
      <img class="app-icon" src="assets/app-icon.png" alt="Lumbar Jack app icon" width="100" height="100" />
      <span class="pill">Coming Soon</span>
      <h1>Lumbar Jack is almost here.</h1>
      <p class="subhead">We're finishing up the final details before submitting to the Mac App Store. Check back soon.</p>
    </section>
  </main>

  <footer>
    <div class="wrap foot-inner">
      <div class="foot-left">Lumbar Jack © 2026</div>
      <nav class="foot-links" aria-label="Footer">
        <a href="privacy.html">Privacy Policy</a>
        <a href="https://github.com/erikh360/lumbar-jack/issues">Support</a>
      </nav>
      <div class="made">Made in Hermanus 🇿🇦</div>
    </div>
  </footer>

<script>
  function handleSubmit(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.textContent = 'You\'re on the list!';
    btn.disabled = true;
    e.target.querySelector('input').disabled = true;
  }
</script>

</body>
</html>
